# Pings the API every 10 minutes so a free Render service is less likely to go to sleep.
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables -> New variable
#   Name: API_URL   Value: https://YOUR-SERVICE.onrender.com
# Notes: GitHub pauses scheduled workflows after 60 days without repository activity (public repos),
# and this uses Render's monthly free instance hours. Delete this file if you do not want it.
name: Keep API awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 "${{ vars.API_URL }}/actuator/health"
