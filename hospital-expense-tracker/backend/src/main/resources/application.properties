spring.application.name=hospital-expense-tracker
server.port=${PORT:8080}
server.error.include-message=always
server.forward-headers-strategy=native
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
spring.web.resources.add-mappings=false

# MongoDB: local by default, Atlas (or any server) via the MONGODB_URI environment variable
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hospital_expense}
# Create the unique indexes declared on the models (usernames, department budgets, lookup names)
spring.data.mongodb.auto-index-creation=true

# JWT: JWT_SECRET must be at least 32 characters. The production profile refuses the development default.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-chars-minimum}
app.jwt.expiration-ms=28800000

# The web app and the API are served from the same origin, so no CORS is configured.

# First-start data.  SEED_DATA=false disables it.
#   SEED_MODE=demo       six demo users + sample expenses (password: SEED_PASSWORD)
#   SEED_MODE=bootstrap  ONE Super Admin from ADMIN_USERNAME / ADMIN_PASSWORD, empty data, default budgets (recommended for real use)
app.seed.enabled=${SEED_DATA:true}
app.seed.mode=${SEED_MODE:demo}
app.seed.password=${SEED_PASSWORD:Password@123}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.name=${ADMIN_NAME:Hospital Admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Invoice uploads (stored in MongoDB GridFS)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Email notifications (optional). Also set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@hospital.local}
app.public-url=${APP_URL:http://localhost:5173}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
management.health.mail.enabled=false

# Shared counters for lockouts and request limits: mongo (default, works with several instances) or memory (one instance)
app.rate-limit.store=${RATE_LIMIT_STORE:mongo}

# Two-factor authentication (authenticator app). MFA_REQUIRED_ROLES e.g. SUPER_ADMIN,FINANCE_ADMIN or "none".
# The production profile requires it for SUPER_ADMIN and FINANCE_ADMIN by default (see application-prod.properties).
app.mfa.required-roles=${MFA_REQUIRED_ROLES:}
app.mfa.key=${MFA_ENCRYPTION_KEY:}
app.mfa.issuer=${MFA_ISSUER:Hospital Finance}

# Single sign-on with OpenID Connect (Microsoft Entra ID, Google, Keycloak, Okta). Redirect URI = APP_URL + /api/auth/sso/callback
app.sso.enabled=${SSO_ENABLED:false}
app.sso.issuer=${OIDC_ISSUER:}
app.sso.client-id=${OIDC_CLIENT_ID:}
app.sso.client-secret=${OIDC_CLIENT_SECRET:}
app.sso.scopes=${OIDC_SCOPES:openid email profile}
# false = only SUPER_ADMIN (break-glass) may still sign in with a password
app.sso.password-login=${SSO_PASSWORD_LOGIN:true}

management.endpoints.web.exposure.include=health
